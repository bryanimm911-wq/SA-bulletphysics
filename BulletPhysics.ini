; ===== SA Bullet Physics =====  taruh di folder configs AML (sebelah SABulletTrails_Weapons.ini)
[General]
Enabled=1
AffectNPC=1          ; 0 = hanya peluru player
LogShots=0           ; 1 = log 60 tembakan pertama ke logcat (tag SABulletPhysics) untuk debug
LogSurface=0         ; 1 = log ID surface yang kena tembak (buat nyetel daftar ricochet)

[Drop]
Enabled=1
Gravity=9.81
DropScale=12.0       ; pengali biar turunnya kelihatan di skala game. Besarkan = lebih nyungsep
MaxDrop=4.0          ; batas turun maksimum (meter)
SegmentLength=6.0    ; presisi lintasan (kecil = halus tapi lebih berat)
MaxSegments=40
MinShotDistance=6.0  ; raycast lebih pendek dari ini tidak dibengkokkan

[Ricochet]
Enabled=1
Chance=0.06          ; 6% dasar. Makin menyerempet (sudut landai) makin besar kemungkinannya
MetalMul=1.0
VehicleMul=0.8
GroundMul=0.5
Spread=0.12          ; acak arah pantulan
Range=35.0           ; jarak lari peluru setelah mantul (meter)
SpeedLoss=0.6        ; kecepatan setelah mantul = 60% (lebih turun lagi)
; ID surface (surfaceinfo.dat). Sesuaikan pakai LogSurface=1 kalau ada yang meleset
MetalSurfaces=50-58
VehicleSurfaces=63-65
GroundSurfaces=1-8,26,27

[Tracer]
SuppressGameTracer=1 ; matikan garis lurus bawaan, diganti garis melengkung
Mode=0               ; 0 = lewat AddTrace2 (ikut style per-senjata dari tracer-mu), 1 = AddTrace (Radius/TimeMs/Alpha)
Radius=0.04
TimeMs=300
Alpha=255
SegmentLength=20.0
MaxSegments=16

[Addresses]          ; offset dari libGTASA.so (diambil dari libBulletTracers64.so-mu). 0 = pakai symbol
AddTrace5=0x8438e8
AddTrace2=0x846db0
FireInstantHit=0
ProcessLineOfSight=0
FindPlayerPed=0

; Per senjata (ID senjata SA): Velocity m/s, DropStart m, RicochetMul
[Weapon_22]
Velocity=350
DropStart=10
[Weapon_30]
Velocity=715
DropStart=25
[Weapon_31]
Velocity=900
DropStart=30
[Weapon_34]
Velocity=920
DropStart=120
